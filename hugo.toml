baseURL = "https://focusponder.com/"
title = "focusponder 的博客"
defaultContentLanguage = "zh-cn"
theme = "PaperMod"

[params]
  mainSections = ["posts"]
  hasCJKLanguage = true
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true

[params.profileMode]
  enabled = true
  title = "focusponder"
  subtitle = "思考·记录·成长"
  buttons = [
    { name = "文章", url = "/posts/" },
    { name = "GitHub", url = "https://github.com/focusponder" }
  ]

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 1
